name: Build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 定位工程
        run: |
          if [ -f DeepSeekHook.zip ]; then
            unzip -q DeepSeekHook.zip
            echo "P=DeepSeekHook" >> "$GITHUB_ENV"
          else
            echo "P=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 生成 wrapper
        working-directory: ${{ env.P }}
        run: gradle wrapper --gradle-version 8.7
      - name: 编译 APK
        working-directory: ${{ env.P }}
        run: ./gradlew assembleLegacyDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHook-apk
          path: ${{ env.P }}/app/build/outputs/apk/legacy/debug/*.apk
